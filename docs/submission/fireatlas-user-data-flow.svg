<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FireAtlas user and data flow</title>
  <desc id="desc">Flowchart showing how a user selects an area and dates, how FireAtlas queries stored NASA FIRMS observations, and how results are interpreted and exported.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f6f1"/><stop offset="1" stop-color="#ebece4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#26332b" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#55705f"/></marker>
    <style>
      .title{font:600 34px Arial,sans-serif;fill:#26332b}.sub{font:400 17px Arial,sans-serif;fill:#667268}.head{font:600 18px Arial,sans-serif;fill:#26332b}.body{font:400 15px Arial,sans-serif;fill:#526057}.small{font:400 13px Arial,sans-serif;fill:#758078}.box{stroke:#cfd6cc;stroke-width:2;rx:18}.line{stroke:#55705f;stroke-width:3;fill:none;marker-end:url(#arrow)}.note{stroke:#9a6b5d;stroke-width:2;stroke-dasharray:8 7;fill:#f7ede8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="75" class="title">FireAtlas user and data flow</text>
  <text x="80" y="108" class="sub">From a study-area question to an evidence-aware result</text>

  <rect x="80" y="210" width="250" height="170" fill="#e4eee5" class="box" filter="url(#shadow)"/>
  <text x="115" y="255" class="head">1 · User frames a question</text>
  <text x="115" y="300" class="body">Selects a region or draws</text><text x="115" y="325" class="body">a custom study area</text><text x="115" y="350" class="body">and chooses dates</text>
  <path d="M330 295 H420" class="line"/>

  <rect x="420" y="210" width="250" height="170" fill="#f1e9e3" class="box" filter="url(#shadow)"/>
  <text x="455" y="255" class="head">2 · API prepares query</text>
  <text x="455" y="300" class="body">Validates bounds and dates</text><text x="455" y="325" class="body">Checks stored coverage</text><text x="455" y="350" class="body">Keeps sensor identity</text>
  <path d="M670 295 H760" class="line"/>

  <rect x="760" y="210" width="250" height="170" fill="#e8ecef" class="box" filter="url(#shadow)"/>
  <text x="795" y="255" class="head">3 · Stored data is queried</text>
  <text x="795" y="300" class="body">PostGIS map points</text><text x="795" y="325" class="body">Daily/monthly aggregates</text><text x="795" y="350" class="body">FRP and sensor counts</text>
  <path d="M1010 295 H1100" class="line"/>

  <rect x="1100" y="210" width="330" height="170" fill="#e4eee5" class="box" filter="url(#shadow)"/>
  <text x="1135" y="255" class="head">4 · Dashboard explains the record</text>
  <text x="1135" y="300" class="body">Map, charts, calendar, and</text><text x="1135" y="325" class="body">preliminary anomaly insights</text><text x="1135" y="350" class="body">appear with context notes</text>

  <path d="M1265 380 V500" class="line"/>
  <rect x="1100" y="500" width="330" height="170" fill="#ffffff" class="box" filter="url(#shadow)"/>
  <text x="1135" y="545" class="head">5 · User acts on evidence</text>
  <text x="1135" y="590" class="body">Compare periods and sensors</text><text x="1135" y="615" class="body">Inspect imagery context</text><text x="1135" y="640" class="body">Download CSV or PDF report</text>

  <path d="M1100 585 H1010" class="line"/>
  <rect x="760" y="500" width="250" height="170" fill="#f7ede8" class="box" filter="url(#shadow)"/>
  <text x="795" y="545" class="head">Interpretation guardrails</text>
  <text x="795" y="590" class="body">Detection ≠ unique fire</text><text x="795" y="615" class="body">Missing ≠ zero activity</text><text x="795" y="640" class="body">FRP ≠ fire size or damage</text>
  <path d="M760 585 H670" class="line"/>
  <rect x="420" y="500" width="250" height="170" fill="#ffffff" class="box" filter="url(#shadow)"/>
  <text x="455" y="545" class="head">Transparent limitations</text>
  <text x="455" y="590" class="body">Coverage gaps stay visible</text><text x="455" y="615" class="body">MODIS/VIIRS remain separate</text><text x="455" y="640" class="body">Anomaly screen is preliminary</text>
  <path d="M420 585 H330" class="line"/>
  <rect x="80" y="500" width="250" height="170" fill="#e4eee5" class="box" filter="url(#shadow)"/>
  <text x="115" y="545" class="head">Responsible outcome</text>
  <text x="115" y="590" class="body">A clear, reproducible view</text><text x="115" y="615" class="body">of available satellite evidence</text><text x="115" y="640" class="body">for research and education</text>

  <text x="80" y="790" class="small">The flow is deliberately evidence-aware: FireAtlas helps users explore patterns without claiming fire cause, perimeter, damage, or public-safety risk from hotspot records alone.</text>
</svg>
