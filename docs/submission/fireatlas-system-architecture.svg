<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">FireAtlas system architecture</title>
  <desc id="desc">Architecture diagram showing NASA FIRMS and NASA imagery flowing through ingestion, validation, PostGIS storage, FastAPI analytics, and the React dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f6f1"/><stop offset="1" stop-color="#ebece4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#26332b" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#55705f"/></marker>
    <style>
      .title{font:600 34px Arial,sans-serif;fill:#26332b}.sub{font:400 17px Arial,sans-serif;fill:#667268}.head{font:600 19px Arial,sans-serif;fill:#26332b}.body{font:400 15px Arial,sans-serif;fill:#526057}.small{font:400 13px Arial,sans-serif;fill:#758078}.box{stroke:#cfd6cc;stroke-width:2;rx:18}.line{stroke:#55705f;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke:#9a6b5d;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="80" y="75" class="title">FireAtlas system architecture</text>
  <text x="80" y="108" class="sub">A provenance-aware pipeline from NASA Earth-observation data to an interactive fire-activity atlas</text>

  <rect x="80" y="175" width="300" height="250" fill="#e4eee5" class="box" filter="url(#shadow)"/>
  <text x="110" y="220" class="head">NASA data sources</text>
  <text x="110" y="264" class="body">NASA FIRMS Area API</text><text x="110" y="289" class="small">MODIS and VIIRS active-fire CSV</text>
  <text x="110" y="335" class="body">NASA Worldview / GIBS</text><text x="110" y="360" class="small">Imagery context links</text>
  <text x="110" y="404" class="small">Source metadata and coverage remain visible</text>

  <rect x="480" y="145" width="310" height="310" fill="#f1e9e3" class="box" filter="url(#shadow)"/>
  <text x="510" y="190" class="head">Ingestion &amp; quality</text>
  <text x="510" y="235" class="body">Bounded 1–5 day requests</text>
  <text x="510" y="270" class="body">Sensor-specific CSV readers</text>
  <text x="510" y="305" class="body">Confidence and coordinate checks</text>
  <text x="510" y="340" class="body">SHA-256 archive manifests</text>
  <text x="510" y="375" class="body">Idempotent fingerprints</text>
  <text x="510" y="420" class="small">Raw files are retained for provenance</text>

  <rect x="895" y="145" width="310" height="310" fill="#e8ecef" class="box" filter="url(#shadow)"/>
  <text x="925" y="190" class="head">PostgreSQL + PostGIS</text>
  <text x="925" y="235" class="body">Raw hotspot records</text>
  <text x="925" y="270" class="body">Normalized observations</text>
  <text x="925" y="305" class="body">Sensor and daily aggregates</text>
  <text x="925" y="340" class="body">0.25° harmonized grid</text>
  <text x="925" y="375" class="body">Reports and provenance</text>
  <text x="925" y="420" class="small">Missing periods remain unknown</text>

  <rect x="1310" y="145" width="220" height="310" fill="#e4eee5" class="box" filter="url(#shadow)"/>
  <text x="1340" y="190" class="head">FastAPI</text>
  <text x="1340" y="235" class="body">Map endpoints</text>
  <text x="1340" y="270" class="body">Analytics</text>
  <text x="1340" y="305" class="body">Calendar</text>
  <text x="1340" y="340" class="body">Anomalies</text>
  <text x="1340" y="375" class="body">Reports</text>
  <text x="1340" y="420" class="small">Same-origin API</text>

  <path d="M380 300 H480" class="line"/><path d="M790 300 H895" class="line"/><path d="M1205 300 H1310" class="line"/>
  <text x="400" y="285" class="small">CSV + metadata</text><text x="805" y="285" class="small">validated rows</text><text x="1215" y="285" class="small">query-ready data</text>

  <rect x="280" y="610" width="1040" height="225" fill="#ffffff" class="box" filter="url(#shadow)"/>
  <text x="320" y="660" class="head">React / TypeScript dashboard</text>
  <text x="320" y="707" class="body">Overview · Explore Map · Fire Calendar · Activity Analysis · Anomaly Insights · Reports</text>
  <text x="320" y="750" class="body">Interactive globe, filters, charts, uncertainty notes, CSV exports, and printable summaries</text>
  <text x="320" y="795" class="small">Users choose a region and date range; the interface explains what the observation record can—and cannot—support.</text>
  <path d="M1420 455 C1420 545 1120 575 900 610" class="line"/>
  <path d="M560 610 C470 545 360 530 280 455" class="dashed"/>
  <text x="1010" y="535" class="small">JSON API responses</text><text x="285" y="535" class="small">User selections</text>

  <rect x="80" y="875" width="1440" height="2" fill="#cfd6cc"/>
  <text x="80" y="915" class="small">FireAtlas design principle: observations are not automatically unique fires; FRP is not fire size; missing coverage is not zero activity.</text>
</svg>
