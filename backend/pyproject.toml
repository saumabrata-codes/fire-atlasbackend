[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fireatlas-api"
version = "0.1.0"
description = "FireAtlas NASA FIRMS observation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "geoalchemy2>=0.15,<1.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "pyproj>=3.7,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "source_backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
